<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horarios NEXFOOD</title>
<style>
:root{--bg:#f4f1ea;--cd:#fff;--c2:#f3efe6;--tx:#1e2433;--mu:#6b7080;--ln:#e3ddd0;--red:#e8553e;--blu:#4f6df5;--amb:#f0a500;--nor:#f3d68a;--at:#8a5a00;--grn:#1fa463;--rep:#0d9488;--coc:#7c3aed;--pt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--cd:#1a1e27;--c2:#232834;--tx:#f1f3f8;--mu:#9aa1b5;--ln:#2b3040;--red:#f0705a;--blu:#7189ff;--at:#ffc233;--nor:#e6c77e;--rep:#2dd4bf;--coc:#a78bfa;--pt:#0b1220}}
:root[data-theme="dark"]{--bg:#101319;--cd:#1a1e27;--c2:#232834;--tx:#f1f3f8;--mu:#9aa1b5;--ln:#2b3040;--red:#f0705a;--blu:#7189ff;--at:#ffc233;--nor:#e6c77e;--rep:#2dd4bf;--coc:#a78bfa;--pt:#0b1220}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 "Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 12px 130px}
.hero{display:flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(135deg,#090d22,#1a2668);color:#fff;border-radius:0 0 28px 28px;padding:20px 16px 28px;margin:-12px -12px 14px;position:relative}
.hero .ln{position:absolute;left:16px;right:16px;bottom:9px;height:3px;border-radius:2px;background:linear-gradient(90deg,#e8553e,#f0a500,#4f6df5)}
.logo{width:72px;height:72px;flex:none;object-fit:contain}
.tt{min-width:0}
h1{margin:0;font:500 1.5rem/1.1 "Poppins",system-ui,sans-serif;letter-spacing:.16em}
small{display:block;color:#ffc233;font-weight:500;font-size:.6rem;letter-spacing:.2em;margin-top:6px;white-space:nowrap}
label{display:block;font-size:.8rem;color:var(--mu);margin:8px 0 4px}
input,select,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;min-height:46px}
input[type=text],input[type=tel],input[type=search],select{width:100%}
h2{margin:18px 4px 8px;font-size:.85rem;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;font-weight:500}
h3.gt{margin:12px 0 2px;font-size:.9rem;font-weight:600}
.alr{background:color-mix(in srgb,var(--amb) 18%,transparent);border:1px solid var(--amb);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.alr p{margin:3px 0;font-weight:500}
.card{background:var(--cd);border:3px solid var(--c);border-radius:22px;margin-bottom:14px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:14px 16px;background:var(--c);color:var(--ct)}
.ch b{flex:1;font-size:1.2rem;font-weight:700}
.cnt{background:var(--ct);color:var(--c);border-radius:99px;min-width:34px;height:34px;padding:0 10px;display:grid;place-items:center;font-weight:700;font-size:1rem}
.sh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:10px 14px 6px;font-weight:500;font-size:.88rem;color:var(--mu)}
.plus{background:var(--c);color:var(--ct);border:0;font-weight:700;font-size:.9rem;min-height:44px;padding:8px 16px;border-radius:99px;box-shadow:0 3px 8px #0003}
.emp{margin:6px 10px;background:var(--c2);border-radius:18px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.main{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;min-height:58px}
.av{width:40px;height:40px;border-radius:50%;background:var(--c);color:var(--ct);display:grid;place-items:center;font-weight:600;flex:none}
.main b{flex:1;font-size:1.05rem;font-weight:500}
.hr{background:color-mix(in srgb,var(--amb) 30%,transparent);color:var(--at);font-weight:500;border-radius:99px;padding:5px 13px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.ctl select{grid-column:1/-1}
.ctl input{text-align:center;font-weight:600}
.q{color:var(--red);font-weight:600;border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.pick{margin:6px 10px 10px;padding:10px;border:2px dashed var(--c);border-radius:18px}
.plist{max-height:230px;overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:6px}
.pi{text-align:left;background:var(--c2);border:0;font-weight:500;width:100%}
.pi.nuevo{color:var(--at);text-align:center}
details{background:var(--cd);border:1px solid var(--ln);border-radius:18px;padding:2px 14px;margin-bottom:10px}
summary{font-weight:500;padding:12px 0}
#dnew{background:linear-gradient(135deg,var(--blu),#3a4fd6);border:0;box-shadow:0 6px 16px color-mix(in srgb,var(--blu) 40%,transparent);color:#fff;padding:0 14px;overflow:hidden}
#dnew summary{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;list-style:none}
#dnew summary::-webkit-details-marker{display:none}
.pl{width:42px;height:42px;border-radius:50%;background:#fff;color:#3a4fd6;display:grid;place-items:center;font-size:1.7rem;font-weight:700;flex:none;line-height:1}
.sx b{display:block;font-size:1.1rem;font-weight:700}
#dnew small{color:#ffffffcc;letter-spacing:0;font-size:.75rem;margin-top:2px;font-weight:400}
.fbody{background:var(--cd);color:var(--tx);margin:0 -14px;padding:6px 14px 8px}
#dstaff{background:linear-gradient(135deg,#7c3aed,#5b21b6);border:0;box-shadow:0 6px 16px #7c3aed55;color:#fff;padding:0 14px;overflow:hidden}
#dstaff summary{display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer;list-style:none;font-weight:400}
#dstaff summary::-webkit-details-marker{display:none}
#dstaff .pl{color:#5b21b6;font-size:1.3rem}
#dstaff small{color:#ffffffcc;letter-spacing:0;font-size:.75rem;margin-top:2px;font-weight:400}
.arr{margin-left:auto;font-size:1.3rem;transition:transform .25s}
#dstaff[open] .arr{transform:rotate(180deg)}
.hd{text-align:center;font-size:1.1rem;font-weight:700;color:var(--tx);letter-spacing:1.2px}
.plus.on{background:var(--red);color:#fff}
.plus.bump{animation:bump .35s ease}
.plus:active,#dnew summary:active,#dstaff summary:active{transform:scale(.95)}
.pick{animation:slide .25s ease}
.pick.out{animation:slideup .18s ease forwards}
@keyframes bump{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes slideup{to{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hdw{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.hdw .nd{margin-top:10px}
.nd{background:none;border:0;color:var(--mu);font-size:.75rem;font-weight:500;min-height:36px;padding:6px 8px;border-radius:99px;justify-self:end;white-space:nowrap}
.nd.sure{background:var(--red);color:#fff;font-weight:700;animation:bump .3s ease}
.toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:#1e2433;color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;z-index:6;box-shadow:0 8px 24px #0004;animation:slide .25s ease}
.toast[hidden]{display:none}
.toast button{background:#fff;color:#1e2433;border:0;font-weight:700;border-radius:12px;min-height:40px;padding:6px 14px}
.big{width:100%;margin:10px 0 8px;background:var(--blu);color:#fff;border:0;font-weight:600;min-height:50px}
.st{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.st.wrap{flex-wrap:wrap}
.st{position:relative;padding-left:14px;flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-left:auto;flex:none}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:3px;background:var(--c)}
.st.rep{--c:var(--rep);--ct:var(--pt)}
.st.coc{--c:var(--coc);--ct:var(--pt)}
.st.amb{--c:linear-gradient(135deg,var(--rep),var(--coc));--ct:var(--pt)}
.st .av{width:36px;height:36px}
.st>.sn{flex:1 1 120px;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.tag{display:inline-block;font-size:.66rem;font-weight:600;border-radius:99px;padding:1px 9px;margin-top:2px;background:var(--c);color:var(--ct)}
h3.gt.rep{color:var(--rep)}
h3.gt.coc{color:var(--coc)}
h3.gt.amb{background:linear-gradient(90deg,var(--rep),var(--coc));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.st>b,.st>input{flex:1}
.st select{width:auto}
.st button{min-height:40px;font-weight:500;padding:6px 12px}
.hoy{color:var(--grn);font-weight:600;font-size:.85rem}
.del{color:var(--red)}
.vacio{color:var(--mu);font-size:.9rem;margin:6px 2px}
#prev{white-space:pre-wrap;background:#0f3d2a;color:#f4f7f4;border-radius:18px;padding:14px;font-size:.95rem;line-height:1.55;border:3px solid var(--amb)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:8px;background:var(--cd);border:1px solid var(--ln);border-radius:22px;box-shadow:0 8px 24px #0002;z-index:5;max-width:616px;margin:0 auto}
.bar>*{min-height:52px;border-radius:15px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
#wa{flex:2;background:var(--grn);color:#fff;border:0}
#copiar{flex:1}
#snd{width:52px;padding:0;font-size:1.2rem}
.firma{text-align:center;margin:22px 0 4px;font-size:.66rem;color:var(--mu);opacity:.5}
:focus-visible{outline:3px solid var(--amb);outline-offset:1px}
</style>

<script>
const SEDES=[["norte","Sede Norte","Suances","var(--blu)","norte","cnorte","#fff"],["sur","Sede Sur","Alcorcón","var(--red)","sur","csur","#fff"],["noroeste","Sede","Fuencarral","var(--nor)","noroeste","cnoroeste","#1a1200"]];
const G=[["sur","Sede Sur – Alcorcón","Sur · Repartidor"],["norte","Sede Norte – Suances","Norte · Repartidor"],["noroeste","Sede – Fuencarral","Noroeste · Repartidor"],["csur","Cocina Sur","Sur · Cocina"],["cnorte","Cocina Norte","Norte · Cocina"],["cnoroeste","Cocina Noroeste – Fuencarral","Noroeste · Cocina"],["desc","Descanso","Descanso"]];
const M=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

let S={phone:"34610735953",emps:base.map((e,i)=>({id:i+1,n:e[0],g:e[1],t:e[2],on:true}))};
try{const r=localStorage.getItem("horarios_nexfood_v2");if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.emps)&&p.emps.length)S=p}}catch(e){}
function norm(x){x.emps.forEach(e=>{if(!e.p)e.p=(/cocina/i.test(e.n)||["csur","cnorte","cnoroeste"].includes(e.g))?"coc":"rep"})}
norm(S);
const $=id=>document.getElementById(id);
let ANIM=null,ref=null,tm=null,mute=false,AC=null,EXP=null,OPEN=null,PQ="",FI=null,EDIT=null;
try{mute=localStorage.getItem("hn_mute")==="1"}catch(e){}
function flush(){if(ref)ref.set({phone:S.phone,emps:S.emps}).catch(()=>{})}
function save(){try{localStorage.setItem("horarios_nexfood_v2",JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(flush,500)}
addEventListener("pagehide",flush);
function tone(f,d,tp,v,t0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);o.type=tp||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const snd={
 add(){if(mute)return;tone(660,.09,"sine",.16);tone(880,.14,"sine",.16,.09);try{navigator.vibrate(15)}catch(e){}},
 del(){if(mute)return;tone(420,.09,"triangle",.18);tone(280,.16,"triangle",.18,.09)},
 tick(){if(mute)return;tone(740,.05,"square",.05)},
 ok(){if(mute)return;[523,659,784,1047].forEach((f,i)=>tone(f,.14,"sine",.16,i*.09));try{navigator.vibrate([20,40,20])}catch(e){}}
};
function fmt(t){if(!t)return"";const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+String(m).padStart(2,"0")+" "+(h>=12?"pm":"am")}
function key(t){if(!t)return 9999;const[h,m]=t.split(":").map(Number);let k=h*60+m;return k<300?k+1440:k}
function grupo(g){return S.emps.filter(e=>e.on&&e.g===g&&e.n.trim()).sort((a,b)=>key(a.t)-key(b.t))}
function gl(id){return G.find(x=>x[0]===id)}
function el(tag,props,kids){const x=document.createElement(tag);Object.assign(x,props||{});(kids||[]).forEach(k=>x.append(k));return x}
function msg(){
 const tit="🗓️ HORARIOS";
 const L=[tit,""];
 const bloque=(ids,cab)=>{
  if(!ids.some(g=>grupo(g).length))return;
  L.push(cab,"");
  ids.forEach(g=>{const a=grupo(g);if(!a.length)return;L.push("📍 "+gl(g)[1].toUpperCase());a.forEach(e=>L.push("• "+e.n.trim()+(e.t?" — "+fmt(e.t):"")));L.push("")});
 };
 bloque(["norte","sur","noroeste"],"🛵 REPARTIDORES");
 bloque(["cnorte","csur","cnoroeste"],"👨‍🍳 COCINA");
 const d=grupo("desc");
 if(d.length){L.push("🏖️ DESCANSO");d.forEach(e=>L.push("• "+e.n.trim()));L.push("")}
 L.push("📋 Horarios De Trabajo – Hoy","","Por Favor, Revisar y Tener Presente su Horario y Estar Atentos a Cualquier Actualización Durante el Día.","","🌙 Que Tengan Un Buen Descanso. 🙏");
 return L.join("\n");
}
function alertas(){
 const A=[],on=S.emps.filter(e=>e.on&&e.n.trim()),v={};
 SEDES.forEach(([id,nom,loc,col,gr,gc])=>{const sn=id==="noroeste"?"Sede Fuencarral":nom,r=on.some(e=>e.g===gr),c=on.some(e=>e.g===gc);if(r&&!c)A.push(sn+" sin cocinero");if(c&&!r)A.push(sn+" sin repartidores")});
 on.forEach(e=>{const k=e.n.trim().toLowerCase();v[k]=(v[k]||0)+1});
 Object.keys(v).forEach(k=>{if(v[k]>1)A.push(on.find(e=>e.n.trim().toLowerCase()===k).n.trim()+" está repetido")});
 on.forEach(e=>{if(e.g!=="desc"&&!e.t)A.push(e.n.trim()+" no tiene hora")});
 const b=$("alr");b.innerHTML="";A.forEach(a=>b.append(el("p",{textContent:"⚠️ "+a})));b.hidden=!A.length;
}
function prev(){
 const t=msg();$("prev").textContent=t;
 $("wa").href="https://wa.me/"+S.phone.replace(/\D/g,"")+"?text="+encodeURIComponent(t);
 alertas();save();
}
function fila(e,g){
 const w=el("div",{className:"emp"});
 const m=el("button",{type:"button",className:"main"},[el("span",{className:"av",textContent:(e.n.trim()[0]||"?").toUpperCase()}),el("b",{textContent:e.n})]);
 if(e.t&&g!=="desc")m.append(el("span",{className:"hr",textContent:fmt(e.t)}));
 m.setAttribute("aria-expanded",EXP===e.id);
 m.onclick=()=>{EXP=EXP===e.id?null:e.id;snd.tick();pinta()};
 w.append(m);
 if(EXP===e.id){
  const c=el("div",{className:"ctl"});
  if(g!=="desc"){const t=el("input",{type:"time",value:e.t||""});t.setAttribute("aria-label","Hora");t.onchange=()=>{e.t=t.value;snd.tick();pinta();prev()};c.append(t)}
  const q=el("button",{type:"button",className:"q",textContent:"Quitar"});q.setAttribute("aria-label","Quitar "+e.n+" del horario");
  q.onclick=()=>{e.on=false;EXP=null;snd.del();pinta();prev()};
  const s=el("select");s.setAttribute("aria-label","Mover a");
  G.forEach(o=>s.append(el("option",{value:o[0],textContent:o[2],selected:o[0]===e.g})));
  s.onchange=()=>{e.g=s.value;if(e.g==="desc")e.t="";else if(!e.t)e.t="19:00";snd.tick();pinta();prev()};
  c.append(q,s);w.append(c);
 }
 return w;
}
function picker(g){
 const box=el("div",{className:"pick"});
 const inp=el("input",{type:"search",placeholder:"Buscar en el staff...",value:PQ});inp.setAttribute("aria-label","Buscar empleado");
 const list=el("div",{className:"plist"});
 const draw=()=>{
  list.innerHTML="";const t=PQ.trim(),q=t.toLowerCase();
  const want=g==="desc"?null:(/^c/.test(g)?"coc":"rep");
  const all=S.emps.filter(e=>!e.on&&e.n.trim()&&e.n.toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n));
  const ok=e=>e.p===want||e.p==="amb";
  const first=want?all.filter(ok):all;
  const add=e=>{const b=el("button",{type:"button",className:"pi",textContent:e.n});b.onclick=()=>{e.on=true;e.g=g;if(g==="desc")e.t="";else if(!e.t)e.t="19:00";OPEN=null;PQ="";snd.add();pinta();prev()};list.append(b)};
  first.forEach(add);
  if(t&&!S.emps.some(e=>e.n.trim().toLowerCase()===q)){
   const b=el("button",{type:"button",className:"pi nuevo",textContent:"＋ Crear «"+t+"» como nuevo"});
   b.onclick=()=>{S.emps.push({id:Date.now(),n:t,g,t:g==="desc"?"":"19:00",on:true,p:/^c/.test(g)?"coc":"rep"});OPEN=null;PQ="";snd.add();pinta();prev()};
   list.append(b);
  }
  if(!list.children.length)list.append(el("p",{className:"vacio",textContent:want==="rep"?"No hay más repartidores disponibles.":want==="coc"?"No hay más cocineros disponibles.":"Todo el staff ya está en el horario."}));
 };
 inp.oninput=()=>{PQ=inp.value;draw()};
 draw();box.append(inp,list);FI=inp;return box;
}
function sub(g,ico,tit){
 const a=S.emps.filter(e=>e.on&&e.g===g).sort((x,y)=>key(x.t)-key(y.t));
 const box=el("div");
 const add=el("button",{type:"button",className:"plus"+(OPEN===g?" on":"")+(ANIM===g?" bump":""),textContent:OPEN===g?"✕ Cerrar":(g==="desc"?"＋ Agregar al descanso":/^c/.test(g)?"＋ Agregar cocinero":"＋ Agregar repartidor")});add.setAttribute("aria-label","Agregar en "+tit);
 add.onclick=()=>{const go=()=>{OPEN=(OPEN===g?null:g);PQ="";ANIM=g;snd.tick();pinta();ANIM=null};const pk=box.querySelector(".pick");if(OPEN===g&&pk){pk.classList.add("out");setTimeout(go,180)}else go()};
 box.append(el("div",{className:"sh"},[el("span",{textContent:(ico?ico+" ":"")+tit+" ("+a.length+")"}),add]));
 if(OPEN===g)box.append(picker(g));
 a.forEach(e=>box.append(fila(e,g)));
 return box;
}
function pinta(){
 const c=$("lista");c.innerHTML="";
 SEDES.forEach(([id,nom,loc,col,gr,gc,ct])=>{
  const card=el("div",{className:"card"});card.style.cssText="--c:"+col+";--ct:"+ct;
  const n=S.emps.filter(e=>e.on&&(e.g===gr||e.g===gc)).length;
  card.append(el("div",{className:"ch"},[el("b",{textContent:nom+" – "+loc}),el("span",{className:"cnt",textContent:n})]),sub(gr,"🛵","Repartidores"),sub(gc,"👨‍🍳","Cocina"));
  c.append(card);
 });
 const d=el("div",{className:"card"});d.style.cssText="--c:#7d86ad;--ct:#fff";
 d.append(el("div",{className:"ch"},[el("b",{textContent:"🏖️ Descanso"}),el("span",{className:"cnt",textContent:S.emps.filter(e=>e.on&&e.g==="desc").length})]),sub("desc","","En descanso"));
 c.append(d);
 $("nd").hidden=!S.emps.some(e=>e.on);
 pintaStaff();
}
const PU=[["rep","🛵 Repartidores"],["coc","👨‍🍳 Cocineros"],["amb","🔁 Ambos puestos"]];
function pintaStaff(){
 const c=$("staff"),q=$("buscar").value.trim().toLowerCase();c.innerHTML="";
 $("dsum").textContent="Staff completo ("+S.emps.length+")";
 const L=S.emps.filter(e=>e.n.toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n));
 if(!L.length)c.append(el("p",{className:"vacio",textContent:q?"Nadie con ese nombre.":"Aún no hay empleados. Crea el primero arriba."}));
 PU.forEach(([p,tit])=>{
  const a=L.filter(e=>e.p===p);if(!a.length)return;
  c.append(el("h3",{className:"gt "+p,textContent:tit+" ("+a.length+")"}));
  a.forEach(e=>{
   const row=el("div",{className:"st "+p});
   let acts=null;
   const ed=el("button",{type:"button",textContent:EDIT===e.id?"Guardar":"Editar"});ed.setAttribute("aria-label","Editar a "+e.n);
   if(EDIT===e.id){
    row.className+=" wrap";
    const i=el("input",{type:"text",value:e.n});i.setAttribute("aria-label","Nombre");FI=i;
    const s=el("select");s.setAttribute("aria-label","Puesto");PU.forEach(o=>s.append(el("option",{value:o[0],textContent:o[1],selected:o[0]===e.p})));
    const sv=()=>{const v=i.value.trim();if(v)e.n=v;e.p=s.value;EDIT=null;snd.add();pinta();prev()};
    i.onkeydown=ev=>{if(ev.key==="Enter")sv()};ed.onclick=sv;row.append(i,s,ed);
   }else{
    ed.onclick=()=>{EDIT=e.id;snd.tick();pintaStaff()};
    row.append(el("span",{className:"av",textContent:(e.n.trim()[0]||"?").toUpperCase()}),el("div",{className:"sn"},[el("b",{textContent:e.n||"(sin nombre)"}),el("div",{className:"tr"},[el("span",{className:"tag",textContent:{rep:"Repartidor",coc:"Cocina",amb:"Ambos"}[p]})].concat(e.on?[el("span",{className:"hoy",textContent:"✓ Hoy"})]:[]))]));
    acts=el("div",{className:"acts"});acts.append(ed);
   }
   const d=el("button",{type:"button",className:"del",textContent:"Eliminar"});d.setAttribute("aria-label","Eliminar a "+e.n+" del staff");
   d.onclick=()=>{if(d.dataset.ok){S.emps=S.emps.filter(z=>z.id!==e.id);snd.del();pinta();prev()}else{d.dataset.ok=1;d.textContent="¿Seguro?";snd.tick()}};
   if(acts){acts.append(d);row.append(acts)}else row.append(d);
   c.append(row);
  });
 });
 if(FI){FI.focus();FI=null}
}
$("buscar").oninput=pintaStaff;
$("fg").onclick=()=>{
 const n=$("fn").value.trim();
 if(!n){snd.del();$("fn").focus();return}
 S.emps.push({id:Date.now(),n,g:$("fp").value==="coc"?"cnorte":"norte",t:"19:00",on:false,p:$("fp").value});
 $("fn").value="";snd.add();pinta();prev();
 const b=$("fg");b.textContent="¡Guardado!";setTimeout(()=>b.textContent="Guardar empleado",1500);
};

 const t=msg(),b=$("copiar");
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}
 snd.ok();b.textContent="¡Copiado!";setTimeout(()=>b.textContent="Copiar",1500);
};
$("wa").onclick=()=>snd.ok();
$("snd").textContent=mute?"🔇":"🔊";
$("snd").onclick=()=>{mute=!mute;try{localStorage.setItem("hn_mute",mute?"1":"0")}catch(e){}$("snd").textContent=mute?"🔇":"🔊";snd.tick()};
$("tel").value=S.phone;
$("tel").oninput=()=>{S.phone=$("tel").value;prev()};
let NDT=null,UT=null,UNDO=null;
function ndReset(b){delete b.dataset.ok;b.textContent="↺ Nuevo día";b.classList.remove("sure")}
$("nd").onclick=()=>{const b=$("nd");
 if(b.dataset.ok){clearTimeout(NDT);ndReset(b);
  UNDO=S.emps.filter(e=>e.on).map(e=>({id:e.id,g:e.g,t:e.t}));
  S.emps.forEach(e=>e.on=false);EXP=null;OPEN=null;snd.del();pinta();prev();
  const t=$("toast");t.hidden=false;clearTimeout(UT);UT=setTimeout(()=>{t.hidden=true;UNDO=null},6000);
 }else{b.dataset.ok=1;b.textContent="¿Seguro?";b.classList.add("sure");snd.tick();NDT=setTimeout(()=>ndReset(b),4000)}};
$("und").onclick=()=>{if(UNDO){UNDO.forEach(u=>{const e=S.emps.find(z=>z.id===u.id);if(e){e.on=true;e.g=u.g;e.t=u.t}})}
 UNDO=null;clearTimeout(UT);$("toast").hidden=true;snd.add();pinta();prev()};
pinta();prev();
(async()=>{try{
 if(!(window.claude&&window.claude.use))return;
 const db=await window.claude.use("db");if(!db)return;
 const r=db.doc("horarios/estado"),s=await r.get();
 if(s.exists){const d=s.data();if(d&&Array.isArray(d.emps)&&d.emps.length){S={phone:d.phone||S.phone,emps:d.emps};norm(S);$("tel").value=S.phone;pinta();prev()}}
 else{await r.set({phone:S.phone,emps:S.emps})}
 ref=r;
}catch(e){}})();
</script>
