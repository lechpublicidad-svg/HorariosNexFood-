<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horarios NEXFOOD</title>
<style>
:root{--bg:#f1f2f8;--card:#fff;--tx:#0d1233;--mut:#5b6288;--ln:#dcdff0;--in:#f6f7fc;--red:#e31b23;--blue:#3552d6;--amb:#ffb000;--gry:#7d86ad;--wa:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070a1a;--card:#0f1530;--tx:#f2f4ff;--mut:#9aa3cf;--ln:#232c5a;--in:#0a0f26;--blue:#5b7cff;--wa:#23b263}}
:root[data-theme="dark"]{--bg:#070a1a;--card:#0f1530;--tx:#f2f4ff;--mut:#9aa3cf;--ln:#232c5a;--in:#0a0f26;--blue:#5b7cff;--wa:#23b263}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:12px 12px 120px}
.hero{background:radial-gradient(circle at 12% 20%,#3a0d14 0,transparent 45%),linear-gradient(135deg,#090d22,#16205a);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--red),var(--amb),var(--blue))}
.top{display:flex;align-items:center;gap:12px}
.logo{width:68px;height:68px;border-radius:16px;flex:none;box-shadow:0 0 18px #e31b2366}
h1{margin:0;font:italic 900 1.6rem/1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:.5px}
h1 small{display:block;font:600 .8rem "Trebuchet MS",system-ui,sans-serif;color:var(--amb);letter-spacing:1px;margin-top:4px;font-style:normal}
.fecha{margin-top:12px}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}
.hero label{color:#c9d0ff}
input,select,button{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;min-height:44px}
input[type=text],input[type=tel],input[type=date],input[type=search]{width:100%}
.hero input{background:#ffffff14;color:#fff;border-color:#ffffff33}
h2{margin:16px 2px 8px;font-size:.95rem;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--c);border-radius:14px;margin-bottom:10px;overflow:hidden}
.gh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:800}
.gh span{flex:1}
.gh i{font-style:normal;background:var(--c);color:#fff;border-radius:99px;min-width:26px;text-align:center;padding:1px 8px;font-size:.85rem}
.gh button{background:var(--c);color:#fff;border:0;font-weight:900;font-size:1.3rem;min-width:44px;padding:0}
.r{display:grid;grid-template-columns:1fr 112px;gap:6px;padding:8px 10px;border-top:1px solid var(--ln)}
.r .n{grid-column:1/-1}
.r.t .n{grid-column:1/2}
.r input[type=time]{text-align:center;font-weight:700}
.q{background:none;color:#e5484d;border-color:#e5484d55;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden;background:var(--card)}
.chip button{border:0;border-radius:0;background:none;min-height:40px;padding:6px 12px;font-weight:700}
.chip .x{color:var(--mut);padding:6px 10px;border-left:1px solid var(--ln)}
.vacio{color:var(--mut);font-size:.9rem;margin:6px 2px}
#prev{white-space:pre-wrap;background:#0f3d2a;color:#f4f7f4;border-radius:14px;padding:14px;font-size:.95rem;line-height:1.55;border:3px solid var(--amb)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--red);z-index:5;max-width:none}
.bar>*{min-height:52px;border-radius:12px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
#wa{flex:2;background:var(--wa);color:#fff;border:0}
#copiar{flex:1}
#snd{width:52px;padding:0;font-size:1.25rem}
details{margin-top:14px}
summary{color:var(--mut);font-size:.9rem;padding:6px 2px}
:focus-visible{outline:3px solid var(--amb);outline-offset:1px}

details{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:4px 12px;margin:0 0 10px}
summary{font-weight:700;color:var(--tx);font-size:1rem;padding:10px 0;cursor:pointer}
.frm label{margin-top:8px}
.frm select{width:100%}
.big{width:100%;margin:12px 0 8px;background:var(--red);color:#fff;border:0;font-weight:800;min-height:50px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--tx);font-size:.95rem}
input[type=checkbox]{min-height:0;width:22px;height:22px;padding:0}
.sub .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-weight:700;border-top:1px solid var(--ln)}
.plus{background:var(--c);color:#fff;border:0;font-weight:800;min-height:40px;padding:6px 14px}
.st{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.inf{flex:1;display:flex;flex-direction:column}
.inf small{color:var(--mut)}
.hoy{color:var(--wa);font-weight:800;font-size:.85rem}
.st button{min-height:40px;font-weight:700;padding:6px 12px}
.st .del{color:#e5484d;border-color:#e5484d55;background:none}

.sub{padding-bottom:2px}
.r{margin:10px;padding:10px;gap:8px;border:1px solid var(--ln);border-left:9px solid var(--c);border-radius:14px;background:var(--in);box-shadow:0 3px 10px #0007}
.r .n{font-size:1.15rem;font-weight:800;background:var(--card)}
.r input[type=time]{border:2px solid var(--c);background:var(--card);font-size:1.1rem}
.r select{background:var(--card)}
</style>
</head>

<script>
const SEDES=[["norte","Sede Norte","Suances","var(--blue)","norte","cnorte"],["sur","Sede Sur","Alcorcón","var(--red)","sur","csur"],["noroeste","Sede Noroeste","Fuencarral","var(--amb)","noroeste","cnoroeste"]];
const G=[["sur","Sede Sur – Alcorcón","Sur · Repartidor"],["norte","Sede Norte – Suances","Norte · Repartidor"],["noroeste","Sede Noroeste – Fuencarral","Noroeste · Repartidor"],["csur","Cocina Sur","Sur · Cocina"],["cnorte","Cocina Norte","Norte · Cocina"],["cnoroeste","Cocina Noroeste – Fuencarral","Noroeste · Cocina"],["desc","Descanso","Descanso"]];
const M=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const base=[["Luis","sur","19:00"],["Angel","sur","21:00"],["Golger","norte","13:30"],["Sebastian","norte","14:00"],["Ali","norte","19:00"],["Saak","norte","20:00"],["Nuevo","norte","20:00"],["Steven","norte","00:00"],["Daniela","csur","07:00"],["Sofia","cnorte","13:00"],["Daniel","cnorte","18:00"],["Prima de Daniel","cnorte","21:00"],["Alender","desc",""],["Sebastian (cocina)","desc",""]];
let S={phone:"34610735953",emps:base.map((e,i)=>({id:i+1,n:e[0],g:e[1],t:e[2],on:true}))};
try{const r=localStorage.getItem("horarios_nexfood_v2");if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.emps)&&p.emps.length)S=p}}catch(e){}
const $=id=>document.getElementById(id);
let ref=null,tm=null,mute=false,AC=null;
try{mute=localStorage.getItem("hn_mute")==="1"}catch(e){}
function save(){
 try{localStorage.setItem("horarios_nexfood_v2",JSON.stringify(S))}catch(e){}
 if(ref){clearTimeout(tm);tm=setTimeout(()=>{ref.set({phone:S.phone,emps:S.emps}).catch(()=>{})},500)}
}
function tone(f,d,tp,v,t0){
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
 const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0);
 o.type=tp||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const snd={
 add(){if(mute)return;tone(660,.09,"sine",.16);tone(880,.14,"sine",.16,.09);try{navigator.vibrate(15)}catch(e){}},
 del(){if(mute)return;tone(420,.09,"triangle",.18);tone(280,.16,"triangle",.18,.09)},
 tick(){if(mute)return;tone(740,.05,"square",.05)},
 ok(){if(mute)return;[523,659,784,1047].forEach((f,i)=>tone(f,.14,"sine",.16,i*.09));try{navigator.vibrate([20,40,20])}catch(e){}}
};
function fmt(t){if(!t)return"";const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+String(m).padStart(2,"0")+" "+(h>=12?"pm":"am")}
function key(t){if(!t)return 9999;const[h,m]=t.split(":").map(Number);let k=h*60+m;return k<300?k+1440:k}
function grupo(g){return S.emps.filter(e=>e.on&&e.g===g&&e.n.trim()).sort((a,b)=>key(a.t)-key(b.t))}
function gl(id){return G.find(x=>x[0]===id)}
function msg(){
 const f=$("fecha").value;let tit="🗓️ HORARIO";
 if(f){const[y,m,d]=f.split("-");tit+=" – "+d+" DE "+M[+m-1]}
 const L=[tit,""];
 const bloque=(ids,cab)=>{
  if(!ids.some(g=>grupo(g).length))return;
  L.push(cab,"");
  ids.forEach(g=>{const a=grupo(g);if(!a.length)return;L.push("📍 "+gl(g)[1].toUpperCase());a.forEach(e=>L.push("• "+e.n.trim()+(e.t?" — "+fmt(e.t):"")));L.push("")});
 };
 bloque(["norte","sur","noroeste"],"🛵 REPARTIDORES");
 bloque(["cnorte","csur","cnoroeste"],"👨‍🍳 COCINA");
 const d=grupo("desc");
 if(d.length){L.push("🏖️ DESCANSO");d.forEach(e=>L.push("• "+e.n.trim()));L.push("")}
 L.push("🎨 Diseñador: crear imagen estilo pizarra verde con este horario y enviarla para compartir con cada empleado.");
 return L.join("\n");
}
function prev(){
 const t=msg();$("prev").textContent=t;
 $("wa").href="https://wa.me/"+S.phone.replace(/\D/g,"")+"?text="+encodeURIComponent(t);
 save();
}
function el(tag,props,kids){const x=document.createElement(tag);Object.assign(x,props||{});(kids||[]).forEach(k=>x.append(k));return x}
let FX=null;
function fila(e,g,foco){
 const r=el("div",{className:"r"+(g==="desc"?"":" t")});
 const n=el("input",{type:"text",value:e.n,placeholder:"Nombre",className:"n"});n.setAttribute("aria-label","Nombre");
 n.oninput=()=>{e.n=n.value;prev()};
 r.append(n);
 if(g!=="desc"){const t=el("input",{type:"time",value:e.t||""});t.setAttribute("aria-label","Hora");t.onchange=()=>{e.t=t.value;snd.tick();pinta();prev()};r.append(t)}
 const s=el("select");s.setAttribute("aria-label","Mover a");
 G.forEach(o=>s.append(el("option",{value:o[0],textContent:o[2],selected:o[0]===e.g})));
 s.onchange=()=>{e.g=s.value;if(e.g==="desc")e.t="";else if(!e.t)e.t="19:00";snd.tick();pinta();prev()};
 const q=el("button",{type:"button",className:"q",textContent:"Quitar"});q.setAttribute("aria-label","Quitar "+e.n+" del horario");
 q.onclick=()=>{e.on=false;snd.del();pinta();prev()};
 r.append(s,q);
 if(foco===e.id)FX=n;
 return r;
}
function sub(g,ico,tit,foco){
 const a=S.emps.filter(e=>e.on&&e.g===g).sort((x,y)=>key(x.t)-key(y.t));
 const box=el("div",{className:"sub"});
 const add=el("button",{type:"button",className:"plus",textContent:"+ Agregar"});add.setAttribute("aria-label","Agregar en "+tit);
 add.onclick=()=>{const id=Date.now();S.emps.push({id,n:"",g,t:g==="desc"?"":"19:00",on:true});snd.add();pinta(id);prev()};
 box.append(el("div",{className:"sh"},[el("span",{textContent:(ico?ico+" ":"")+tit+" ("+a.length+")"}),add]));
 a.forEach(e=>box.append(fila(e,g,foco)));
 return box;
}
function pinta(foco){
 const c=$("lista");c.innerHTML="";
 SEDES.forEach(([id,nom,loc,col,gr,gc])=>{
  const n=S.emps.filter(e=>e.on&&(e.g===gr||e.g===gc)).length;
  const card=el("div",{className:"card"});card.style.setProperty("--c",col);
  card.append(el("div",{className:"gh"},[el("span",{textContent:nom+" – "+loc}),el("i",{textContent:n})]));
  card.append(sub(gr,"🛵","Repartidores",foco),sub(gc,"👨‍🍳","Cocina",foco));
  c.append(card);
 });
 const d=el("div",{className:"card"});d.style.setProperty("--c","var(--gry)");
 d.append(el("div",{className:"gh"},[el("span",{textContent:"🏖️ Descanso"}),el("i",{textContent:S.emps.filter(e=>e.on&&e.g==="desc").length})]));
 d.append(sub("desc","","En descanso",foco));
 c.append(d);
 pintaStaff();
 if(FX){FX.focus();FX=null}
}
function pintaStaff(){
 const c=$("staff"),q=$("buscar").value.trim().toLowerCase();c.innerHTML="";
 $("dsum").textContent="👥 Staff completo ("+S.emps.length+")";
 const L=S.emps.filter(e=>e.n.toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n));
 if(!L.length){c.append(el("p",{className:"vacio",textContent:q?"Nadie con ese nombre.":"Aún no hay empleados. Crea el primero arriba."}));return}
 L.forEach(e=>{
  const row=el("div",{className:"st"});
  row.append(el("div",{className:"inf"},[el("b",{textContent:e.n||"(sin nombre)"}),el("small",{textContent:(gl(e.g)||[0,0,"—"])[2]})]));
  if(e.on){row.append(el("span",{className:"hoy",textContent:"✓ Hoy"}))}
  else{const a=el("button",{type:"button",textContent:"Agregar hoy"});a.setAttribute("aria-label","Agregar "+e.n+" al horario");a.onclick=()=>{e.on=true;snd.add();pinta();prev()};row.append(a)}
  const d=el("button",{type:"button",className:"del",textContent:"Eliminar"});d.setAttribute("aria-label","Eliminar a "+e.n+" del staff");
  d.onclick=()=>{if(d.dataset.ok){S.emps=S.emps.filter(z=>z.id!==e.id);snd.del();pinta();prev()}else{d.dataset.ok=1;d.textContent="¿Seguro?";snd.tick()}};
  row.append(d);c.append(row);
 });
}
$("buscar").oninput=pintaStaff;
$("fg").onclick=()=>{
 const n=$("fn").value.trim();
 if(!n){snd.del();$("fn").focus();return}
 const sede=$("fs").value,g=$("fr").value==="rep"?sede:"c"+sede;
 S.emps.push({id:Date.now(),n,g,t:$("fh").value,on:$("fa").checked});
 $("fn").value="";snd.add();pinta();prev();
 const b=$("fg");b.textContent="¡Guardado!";setTimeout(()=>b.textContent="Guardar empleado",1500);
};
$("copiar").onclick=async()=>{
 const t=msg(),b=$("copiar");
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}
 snd.ok();b.textContent="¡Copiado!";setTimeout(()=>b.textContent="Copiar",1500);
};
$("wa").onclick=()=>snd.ok();
$("snd").textContent=mute?"🔇":"🔊";
$("snd").onclick=()=>{mute=!mute;try{localStorage.setItem("hn_mute",mute?"1":"0")}catch(e){}$("snd").textContent=mute?"🔇":"🔊";snd.tick()};
$("tel").value=S.phone;
$("tel").oninput=()=>{S.phone=$("tel").value;prev()};
const man=new Date();man.setDate(man.getDate()+1);
$("fecha").value=man.getFullYear()+"-"+String(man.getMonth()+1).padStart(2,"0")+"-"+String(man.getDate()).padStart(2,"0");
$("fecha").onchange=()=>{snd.tick();prev()};
pinta();prev();
(async()=>{try{
 if(!(window.claude&&window.claude.use))return;
 const db=await window.claude.use("db");if(!db)return;
 const r=db.doc("horarios/estado"),s=await r.get();
 if(s.exists){const d=s.data();if(d&&Array.isArray(d.emps)&&d.emps.length){S={phone:d.phone||S.phone,emps:d.emps};$("tel").value=S.phone;pinta();prev()}}
 else{await r.set({phone:S.phone,emps:S.emps})}
 ref=r;
}catch(e){}})();
</script>
</body>
</html>
